name: SSDLC security gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: feedback_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:isolated-ci-password@127.0.0.1:5432/feedback_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install reviewed Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Source security policy
        run: python3 scripts/security-check.py
      - name: Backend formatting, lints and security tests
        working-directory: backend
        run: |
          cargo +1.85.1 fmt --check
          cargo +1.85.1 clippy --all-targets --locked -- -D warnings
          cargo +1.85.1 test --locked
          cargo +1.85.1 test --locked --test postgres -- --ignored
      - name: Frontend formatting and browser compilation
        working-directory: frontend
        env:
          RUSTUP_TOOLCHAIN: 1.85.1
        run: |
          cargo +1.85.1 fmt --check
          cargo +1.85.1 clippy --target wasm32-unknown-unknown --locked -- -D warnings
          cargo +1.85.1 install trunk --version 0.21.14 --locked
          trunk build --release --locked
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: Dependency and infrastructure scanning
        run: docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.76.2 fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 /repo
# Deployment is intentionally absent. Required status checks and release approval
# must be configured by the repository/deployment owner after these jobs pass.
